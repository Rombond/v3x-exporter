services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: [PORT]
    ports:
      - "${EXPORTER_PORT:-9101}:${PORT:-9090}"
    environment:
      - V3X_USERNAME=${V3X_USERNAME:-}
      - V3X_EMAIL=${V3X_EMAIL:-}
      - V3X_PASSWORD=${V3X_PASSWORD:-}
      - V3X_BASE_URL=${V3X_BASE_URL:-https://api.v3x.club}
      - METRICS_PATH=${METRICS_PATH:-/metrics}
      - PORT=${PORT:-9090}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-5m}
    restart: unless-stopped
